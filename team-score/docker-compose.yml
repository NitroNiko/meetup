services:
  wyc-team-score:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      ADMIN_PIN: "${ADMIN_PIN:-change-me}"
    volumes:
      - wyc-team-score-data:/app/data
    restart: unless-stopped

volumes:
  wyc-team-score-data:
