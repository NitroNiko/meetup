# Fly.io config for WYC Team Score
# Docs: https://fly.io/docs/reference/configuration/

app = "wyc-team-score"
primary_region = "fra"

[build]

[env]
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent SQLite storage
[[mounts]]
  source = "wyc_data"
  destination = "/app/data"
